<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg0:#121214;        /* deepest surface */
  --bg1:#1a1a1c;        /* window body */
  --bg2:#222226;        /* chrome / titlebars */
  --bg3:#2c2c31;        /* hover / raised */
  --line:#37373d;       /* hairlines */
  --txt:#d6d4cf;        /* primary text */
  --dim:#8a8782;        /* secondary text */
  --faint:#5c5a56;      /* tertiary */
  --orange:#ffa500;     /* system accent / alert */
  --orange-dim:#b9791b;
  --ether:#54d6e0;      /* thin cyan ether glow */
  --violet:#9a7bff;     /* ether violet */
  --danger:#ff5c4d;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --serif:'Spectral',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  font-family:var(--mono);
  color:var(--txt);
  background:#000;
  user-select:none;
  -webkit-user-select:none;
}

/* ===================== BOOT / LOGIN ===================== */
#login{
  position:fixed;inset:0;z-index:9000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(154,123,255,.15), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(84,214,224,.12), transparent 60%),
    radial-gradient(700px 400px at 50% 105%, rgba(255,165,0,.05), transparent 60%),
    linear-gradient(160deg,#0f0e13,#16161c 60%,#0e0e12);
}
.login-card{width:340px;text-align:center}
.login-avatar{
  width:96px;height:96px;border-radius:50%;object-fit:cover;
  border:1px solid var(--line);margin:0 auto 18px;display:block;
  filter:grayscale(.25) contrast(1.02);
  box-shadow:0 0 0 6px rgba(255,165,0,.04),0 0 30px rgba(0,0,0,.6);
}
.login-os{font-size:11px;letter-spacing:.42em;color:var(--faint);text-transform:uppercase;margin-bottom:28px}
.login-welcome{font-family:var(--serif);font-size:23px;color:var(--txt);margin:0 0 4px}
.login-welcome b{color:var(--orange);font-weight:500}
.login-sub{font-size:11px;color:var(--faint);margin:0 0 26px;letter-spacing:.02em}
.login-btn{
  font-family:var(--mono);font-size:13px;letter-spacing:.05em;
  background:transparent;color:var(--orange);
  border:1px solid var(--orange-dim);border-radius:6px;
  padding:11px 30px;cursor:pointer;transition:.18s;
}
.login-btn:hover{background:rgba(255,165,0,.08);box-shadow:0 0 22px rgba(255,165,0,.10)}
.login-foot{position:absolute;bottom:18px;font-size:10px;color:var(--faint);letter-spacing:.18em}
.login-foot .dot{color:var(--ether)}

.boot-line{font-size:11px;color:var(--dim);height:14px;letter-spacing:.04em}

/* ===================== DESKTOP ===================== */
#desktop{
  position:fixed;inset:0;z-index:1;display:none;
  background:
    radial-gradient(1400px 700px at 78% -15%, rgba(154,123,255,.16), transparent 55%),
    radial-gradient(1100px 600px at -5% 115%, rgba(84,214,224,.13), transparent 55%),
    radial-gradient(900px 500px at 35% 115%, rgba(255,165,0,.07), transparent 60%),
    linear-gradient(165deg,#13121a,#181722 55%,#0e0d13);
  overflow:hidden;
}
#wallpaper{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#wallpaper svg{position:absolute;inset:0;width:100%;height:100%}
#wallpaper::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,10,14,.16),rgba(10,10,14,.26) 65%,rgba(8,8,11,.52));
}

/* desktop icons */
#icons{position:absolute;top:18px;left:14px;display:flex;flex-direction:column;gap:4px;flex-wrap:wrap;max-height:calc(100% - 80px)}
.dicon{
  width:84px;padding:9px 6px;border-radius:8px;text-align:center;cursor:pointer;
  color:var(--txt);transition:.12s;border:1px solid transparent;
}
.dicon:hover{background:rgba(14,14,18,.45);border-color:var(--line)}
.dicon.sel{background:rgba(255,165,0,.12);border-color:var(--orange-dim)}
.dicon .gl{font-size:26px;line-height:1;display:block;margin-bottom:6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.dicon .lb{font-size:10.5px;color:#c9c6c0;letter-spacing:.01em;word-break:break-word;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.dicon.alert .gl{animation:pulseOrange 1.6s ease-in-out infinite}
@keyframes pulseOrange{0%,100%{filter:drop-shadow(0 0 0 rgba(255,165,0,0))}50%{filter:drop-shadow(0 0 8px rgba(255,165,0,.7))}}

/* ===================== WINDOWS ===================== */
.win{
  position:absolute;min-width:280px;min-height:160px;
  background:var(--bg1);border:1px solid var(--line);border-radius:9px;
  box-shadow:0 18px 50px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.02) inset;
  display:flex;flex-direction:column;overflow:hidden;
  animation:winIn .14s ease-out;
}
@keyframes winIn{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.win.focused{border-color:#4a4a52;box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,165,0,.06)}
.titlebar{
  height:34px;flex:0 0 34px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(var(--bg2),#1d1d21);border-bottom:1px solid var(--line);
  cursor:default;
}
.tb-glyph{font-size:13px;filter:grayscale(.2)}
.tb-title{font-size:11.5px;color:var(--dim);letter-spacing:.04em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.focused .tb-title{color:var(--txt)}
.tb-btns{display:flex;gap:7px}
.tb-btn{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;padding:0;opacity:.85;transition:.12s}
.tb-btn:hover{opacity:1}
.tb-min{background:#3a3a40}
.tb-min:hover{background:#55555c}
.tb-close{background:#5a2f2a}
.tb-close:hover{background:var(--danger)}
.win-body{flex:1;overflow:auto;position:relative}
.win-body::-webkit-scrollbar{width:10px;height:10px}
.win-body::-webkit-scrollbar-thumb{background:#33333a;border-radius:5px;border:2px solid var(--bg1)}
.win-body::-webkit-scrollbar-thumb:hover{background:#44444c}
.resize-h{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.resize-h::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint)}

/* ===================== FILES APP ===================== */
.files{display:flex;height:100%;font-size:12px}
.files-side{width:150px;flex:0 0 150px;background:#161619;border-right:1px solid var(--line);padding:8px 0;overflow:auto}
.files-crumb{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:11px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.files-crumb .seg{color:var(--orange)}
.side-item{padding:6px 12px;color:var(--dim);cursor:pointer;display:flex;gap:7px;align-items:center;border-left:2px solid transparent}
.side-item:hover{background:var(--bg3);color:var(--txt)}
.side-item.active{color:var(--orange);border-left-color:var(--orange);background:rgba(255,165,0,.06)}
.files-main{flex:1;display:flex;flex-direction:column}
.files-list{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;align-content:start;overflow:auto}
.fitem{padding:12px 8px 10px;border-radius:7px;text-align:center;cursor:pointer;border:1px solid transparent;transition:.1s}
.fitem:hover{background:var(--bg3);border-color:var(--line)}
.fitem .fg{font-size:30px;display:block;margin-bottom:7px;filter:grayscale(.15)}
.fitem .fn{font-size:10.5px;color:var(--txt);word-break:break-word;line-height:1.3}
.fitem.unread .fn::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ether);margin-left:4px;vertical-align:middle;box-shadow:0 0 6px var(--ether)}
.fitem.folder .fg{color:#d8b66a}
.fitem.justadded{animation:flashAdd 1.4s ease-out}
@keyframes flashAdd{0%,40%{background:rgba(255,165,0,.18);border-color:var(--orange-dim)}100%{background:transparent}}
.files-empty{color:var(--faint);padding:30px;text-align:center;font-style:italic;font-size:12px;grid-column:1/-1}

/* ===================== READER (notes/docs) ===================== */
.reader{padding:30px 38px;max-width:740px;margin:0 auto;line-height:1.62}
.reader.lab{font-family:var(--mono);font-size:12.5px;color:#c9cdd1}
.reader.grief{font-family:var(--serif);font-size:16px;color:#cfc9c0}
.reader.grief p{margin:0 0 1.05em}
.reader.lab .h{color:var(--orange);letter-spacing:.06em;font-weight:700;margin-bottom:14px;font-size:12px}
.reader.plain{font-family:var(--sans);font-size:14px;color:#cdccc8;line-height:1.66}
.reader .meta-strip{font-family:var(--mono);font-size:10.5px;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px;letter-spacing:.04em}
.redact{background:#3a3a3f;color:transparent;border-radius:2px;padding:0 .15em;user-select:none}
.docnote{white-space:pre-wrap}

/* ===================== MAIL APP ===================== */
.mail{display:flex;height:100%;font-size:12px}
.mail-side{width:140px;flex:0 0 140px;background:#161619;border-right:1px solid var(--line);padding:8px 0}
.mail-folder{padding:8px 12px;color:var(--dim);cursor:pointer;display:flex;justify-content:space-between;border-left:2px solid transparent}
.mail-folder:hover{background:var(--bg3);color:var(--txt)}
.mail-folder.active{color:var(--orange);border-left-color:var(--orange);background:rgba(255,165,0,.06)}
.mail-folder .ct{font-size:10px;color:var(--faint)}
.mail-list{width:230px;flex:0 0 230px;border-right:1px solid var(--line);overflow:auto}
.mrow{padding:11px 13px;border-bottom:1px solid #232328;cursor:pointer;transition:.1s}
.mrow:hover{background:var(--bg3)}
.mrow.active{background:rgba(255,165,0,.07)}
.mrow.unread .mfrom{color:var(--txt)}
.mrow.unread::before{content:"";float:right;width:6px;height:6px;border-radius:50%;background:var(--ether);margin-top:4px;box-shadow:0 0 6px var(--ether)}
.mfrom{font-size:11px;color:var(--dim);margin-bottom:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msubj{font-size:11.5px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.unread .msubj{color:#fff}
.mdate{font-size:9.5px;color:var(--faint);margin-top:3px;letter-spacing:.03em}
.mail-read{flex:1;overflow:auto;padding:24px 30px}
.mail-read .mh{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.mail-read .mh .s{font-family:var(--serif);font-size:18px;color:var(--txt);margin-bottom:10px}
.mail-read .mh .kv{font-size:11px;color:var(--dim);margin:2px 0}
.mail-read .mh .kv b{color:var(--faint);font-weight:400;display:inline-block;width:46px}
.mail-read .body{font-family:var(--serif);font-size:14.5px;line-height:1.66;color:#cfcabf;white-space:pre-wrap}
.mail-read .body.mono{font-family:var(--mono);font-size:12.5px;color:#c9cdd1;line-height:1.6}
.mail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-style:italic}
.thread-msg{border-left:2px solid var(--line);padding:2px 0 2px 16px;margin-bottom:22px}
.thread-msg .th{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-bottom:8px;line-height:1.7}
.thread-msg .th b{color:var(--dim);font-weight:400}

/* ===================== IMAGE VIEWER ===================== */
.iv{display:flex;flex-direction:column;height:100%;background:#0c0c0e}
.iv-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;position:relative}
.iv-stage svg,.iv-stage img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.iv-stage img{object-fit:contain}
.iv-cap{padding:10px 16px;border-top:1px solid var(--line);background:#141416;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--dim);text-align:center;min-height:20px}
.iv-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.iv-nav{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:5px;width:26px;height:24px;cursor:pointer;font-size:13px}
.iv-nav:hover{color:var(--orange);border-color:var(--orange-dim)}
.iv-count{font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.iv-thumbs{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);overflow-x:auto;background:#0e0e10}
.iv-thumb{width:54px;height:40px;flex:0 0 54px;border-radius:4px;border:1px solid var(--line);overflow:hidden;cursor:pointer;opacity:.6;transition:.12s}
.iv-thumb.active{opacity:1;border-color:var(--orange)}
.iv-thumb:hover{opacity:1}
.iv-thumb svg{width:100%;height:100%}
.iv-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ===================== MUSIC ===================== */
.music{padding:0;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#16161a,#101012)}
.music-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.music-head .pl{font-family:var(--serif);font-size:17px;color:var(--txt)}
.music-head .sub{font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin-top:3px}
.tracks{flex:1;overflow:auto;padding:6px 0}
.track{display:flex;align-items:center;gap:12px;padding:10px 22px;cursor:pointer;font-size:12.5px;color:var(--dim);border-left:2px solid transparent}
.track:hover{background:var(--bg3);color:var(--txt)}
.track.playing{color:var(--ether);border-left-color:var(--ether);background:rgba(84,214,224,.05)}
.track .num{width:18px;color:var(--faint);font-size:11px}
.track .nm{flex:1}
.track .eq{display:none;gap:2px;align-items:flex-end;height:13px}
.track.playing .eq{display:flex}
.track .eq i{width:3px;background:var(--ether);animation:eq .9s ease-in-out infinite}
.track .eq i:nth-child(2){animation-delay:.2s}.track .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:13px}}
.track.special .nm::after{content:" ◆";color:var(--violet);font-size:10px}
.music-foot{padding:12px 22px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint);font-style:italic;font-family:var(--serif);min-height:18px}

/* ===================== ETHER MONITOR ===================== */
.ether{padding:20px;height:100%;font-size:12px;display:flex;flex-direction:column;gap:16px;background:#0d0e10}
.ether-read{text-align:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:#121316}
.ether-val{font-size:15px;letter-spacing:.06em;margin-top:6px}
.ether-val.nominal{color:var(--ether)}
.ether-val.anom{color:var(--orange);animation:pulseOrange 1.2s infinite}
.ether-graph{height:70px;border:1px solid var(--line);border-radius:8px;background:#121316;position:relative;overflow:hidden}
.ether-graph svg{position:absolute;inset:0;width:100%;height:100%}
.ether-log{flex:1;overflow:auto;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:10px;background:#101113;line-height:1.8}
.ether-log .anom{color:var(--orange)}
.ether-log .t{color:var(--faint)}
.ether-legend{position:absolute;right:8px;top:5px;font-size:9.5px;color:var(--dim);font-family:var(--mono)}
.ether-btn{background:transparent;border:1px solid var(--line);color:var(--ether);border-radius:6px;padding:9px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.ether-btn:hover{border-color:var(--ether);box-shadow:0 0 14px rgba(84,214,224,.15)}
.ether-btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.ether-sweep{height:3px;border-radius:2px;background:#1a1c20;overflow:hidden;visibility:hidden}
.ether-sweep i{display:block;height:100%;width:0;background:var(--ether);transition:width 2.6s linear}

/* ===================== BROWSE (web explorer) ===================== */
.web{display:flex;flex-direction:column;height:100%;background:#0f0f12}
.web-bar{display:flex;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg2);align-items:center;position:relative}
.web-btn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:5px;width:28px;height:26px;cursor:pointer;font-size:13px}
.web-btn:hover{color:var(--orange);border-color:var(--orange-dim)}
.web-addr{flex:1;background:#0e0e10;border:1px solid var(--line);border-radius:5px;color:var(--txt);font-family:var(--mono);font-size:11px;padding:6px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web-addr:hover{border-color:var(--orange-dim)}
.web-menu{position:absolute;top:40px;left:80px;right:10px;background:#1b1b20;border:1px solid var(--line);border-radius:7px;z-index:10;box-shadow:0 14px 30px rgba(0,0,0,.5);overflow:hidden}
.web-menu div{padding:8px 12px;font-size:11px;color:var(--dim);cursor:pointer;font-family:var(--mono)}
.web-menu div:hover{background:var(--bg3);color:var(--orange)}
.web-page{flex:1;overflow:auto;background:#0f0f12}

/* --- browser start page (the OS's own new-tab, stays dark) --- */
.web-start{padding:26px 30px 40px;max-width:720px;margin:0 auto}
.web-logo{font-family:var(--mono);letter-spacing:.3em;color:var(--orange);text-align:center;font-size:18px;margin:18px 0 24px}
.web-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:26px}
.web-tile{background:#1a1a1f;border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;transition:.12s;display:flex;gap:11px;align-items:center}
.web-tile:hover{background:var(--bg3);transform:translateY(-1px)}
.web-tile .fav{width:26px;height:26px;border-radius:6px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#10100f;font-weight:700}
.web-tile b{display:block;font-size:12px;color:var(--txt);margin-bottom:2px}
.web-tile span{font-size:9.5px;color:var(--faint);font-family:var(--mono)}
.web-h2{font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.web-hist{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid #232328;font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer}
.web-hist:hover{color:var(--orange)}
.web-hist .t{color:var(--faint);font-size:10px;white-space:nowrap}
.web-hist.ghost .t{color:var(--orange)}

/* ===================== WEBSITES (each its own identity) ===================== */
.ws{min-height:100%;font:14px/1.55 system-ui,'Inter',sans-serif}
.ws-wrap{max-width:660px;margin:0 auto;padding:0 24px}
.ws-nav{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;letter-spacing:.03em}
.ws-nav b{cursor:pointer;font-weight:500;opacity:.82}
.ws-nav b:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.ws h1{margin:0}
.ws p{margin:.5em 0}
/* image slot with graceful text fallback */
.wimg{position:relative;overflow:hidden;border-radius:6px;background:#e7e3d8}
.wimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.wimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8d8678;font:italic 11px/1.45 Georgia,serif;padding:10px;
  background:repeating-linear-gradient(45deg,#eceadf,#eceadf 11px,#e4e1d4 11px,#e4e1d4 22px)}

/* 1 — Coast Ether & Power : corporate utility, teal */
.ws-ether{background:#f4f7f8;color:#22383d}
.ws-ether .top{background:#0d6e7e;color:#eafafa}
.ws-ether .top .ws-wrap{display:flex;align-items:center;justify-content:space-between;padding-top:13px;padding-bottom:13px}
.ws-ether .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:.01em}
.ws-ether .brand .mk{width:20px;height:20px;border-radius:50%;background:#7fd6df;box-shadow:inset 0 0 0 3px #0d6e7e}
.ws-ether .hero{background:#e3eef0;border-bottom:3px solid #0d6e7e}
.ws-ether .hero .ws-wrap{padding-top:22px;padding-bottom:20px}
.ws-ether .hero h1{font-size:21px;color:#0a5662}
.ws-ether .hero .sub{color:#5c7a7f;font-size:12px;margin-top:4px}
.ws-ether section{padding:8px 0 4px}
.ws-ether h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0a5662;margin:18px 0 8px}
.ws-ether .card{background:#fff;border:1px solid #d6e2e4;border-radius:8px;padding:13px 15px;margin:10px 0;box-shadow:0 1px 2px rgba(13,110,126,.06)}
.ws-ether .card b{color:#143a40}

/* ---- THREAD B — Aurora ---- */
'she-asked-again':{name:'she-asked-again.txt',app:'notes',glyph:'📓',style:'grief',thread:'B',
 body:`She asked who I was again today.

I told her I was her sister. She smiled — that easy smile she still has, the one
thing it didn't take — and she said, "I always wanted a sister." Like it was good
news. Like I was a stranger bringing her a gift.

I said yes. You have one. I'm right here.

She asked if I'd visit again. As if I am someone who visits. As if I have ever,
once, since this started, gone more than nine days without standing in that room.

I left before she saw my face do the thing it does.

I am going to fix this. I do not care what it costs, or who I have to become to buy
the means.`},

'timeline':{name:'timeline.txt',app:'notes',glyph:'📄',style:'lab',thread:'B',
 body:`AURORA — LAST LUCID MONTHS (reconstructed, best effort)

— Spring: normal. Letters, visits, the river survey work. Sharp as ever.
— Early summer: the trial. She volunteered. "Paid, harmless, twenty minutes with
  a partner Pokémon and a very polite technician." Her words, in her last normal
  letter. I have read that letter four hundred times.
— After: three weeks of "tired." Headaches. Names going soft at the edges.
— Then the drop. Not gradual after that point. A door closing.
— By autumn she did not reliably know our mother. By winter she did not know me.

The doctors call it idiopathic. Idiopathic means "we don't know and we've stopped
looking." I have not stopped looking.

The ONLY anomaly in her year is the trial. Everyone wants me to accept coincidence.
I am a scientist. I do not believe in a healthy woman whose mind empties three weeks
after she was wired to a Pokémon and told to "share an experience."`},

'records-wall':{name:'records-wall.txt',app:'notes',glyph:'📄',style:'lab',thread:'B',
 body:`What I have been able to get:
  - Her intake form. Real. Her signature. The program name redacted on the copy
    they released, of course.
  - A consent waiver so broad it consents to the heat death of the universe.
  - Nothing else. The trial's sponsor "cannot locate" the dataset. The technician
    "is no longer with the program." The program "concluded."

What I have learned trying:
  - A legitimate request gets you a legitimate wall.
  - The people who ran that trial have resources, lawyers, and silence I cannot
    out-spend or out-wait.
  - There is exactly one kind of organisation that can open doors like these, and
    they came to ME, in the end. They offered access. Whether I should have said no
    is a luxury question, and Aurora does not have time for my conscience.

If the share took something out of her, the share can be made to give it back.
First I have to find where it went.`},

/* ---- THREAD C — shared-exp research ---- */
'share-principle':{name:'share-principle.txt',app:'notes',glyph:'📄',style:'lab',thread:'C',
 body:`PRINCIPLE OF THE SHARE (working notes — mine, not theirs)

A trainer and a bonded Pokémon already exchange more than commands. The bond
carries feeling, intent, a thread of shared life — the southern tribes have a word,
mauri, and they are not wrong to use it. The Share is the engineering of that thread.

Done lightly, it is a teaching tool. A partner that did not stand in the fight still
receives the experience of it along the link — the lesson without the danger. Hang
the device between trainer and a second partner and the second partner grows from
battles it never entered. That is the version they want to sell. That is the version
that is safe.

That is not the version that interests me, and it is not, I am now certain, the
version Aurora was given.`},

'door-both-ways':{name:'door-both-ways.txt',app:'notes',glyph:'📄',style:'lab',thread:'C',
 body:`The Share is not a teaching tool. It is a door. Doors swing both ways.

Experience can flow to a partner. It can also flow FROM a person — and the link does
not care which direction is "supposed." Push the gain too hard, hold the channel open
too long, and you are not copying experience anymore. You are MOVING it. And what moves
out does not always move back.

Memory is experience that stayed. I can no longer pretend I don't know what that means
for a healthy woman who sat in a chair for twenty minutes, wired to a partner, told to
open the channel as wide as it would go "for a clean reading."

And a channel opened that far does not close on its own. The session was twenty
minutes. The door stayed open for three weeks. The "tired," the headaches, the names
going soft at the edges — that was the draining, and nobody watching knew to shut it.

Somewhere there is a Pokémon carrying my sister — not twenty minutes of her, the
whole record of her — that she will never get back unless I take it out and put it
where it belongs. If that is even possible. I will make it possible.`},

'loose-ends':{name:'loose-ends.txt',app:'notes',glyph:'📄',style:'lab',thread:'C',
 body:`THREADS I CAN STILL PULL:

1. The prototype. The early field unit — not the polished demo, the ugly first one
   that ran too hot — was never logged back into inventory. Last I can place it: a
   storage cage at ████████, signed out and never returned. If anyone still has a unit
   that can run the channel in REVERSE, it is that one.

2. The technician. "No longer with the program" — because he WALKED. He saw something
   in an early session that frightened him out of a career. I have a name and a region.
   A man who quit in protest will talk, if the right person asks the right way. He may
   be the only honest witness left.

3. The carrier. If a subject's experience went somewhere, it went into a PARTNER. Find
   the partner Pokémon from Aurora's trial and you find what she lost — "still carrying
   something that isn't its own," if the early notes are right. It was never returned to
   the wild or to records. Someone kept it. Find who.

Three threads. Any one of them is a way in. I will pull all three.`},

The night-cycle footage from the breach has movement patterns that don't resolve to any body on your team roster. If P-1 — or anything derived from it — was on that floor, I need to know inside the hour. The exposure here is not yours alone.

MB`},
      {from:'████@████.sec',to:'a.pine@starhaven.lib',body:`There is unaccounted genetic material at the breach site. If P-1 was used and did not fully revert, we are past discussion.

Initiate containment. Erase the trace. Your commitment is not in question; your judgment this cycle is. We settle the consequences once the floor is clean.
MB

[no reply from a.pine was ever sent in this thread]`},
     ]},
    {id:'a5', subj:'A candidate (Maxine Blaze)', date:'work archive · thread 5', unread:false, thread:'cache',
     msgs:[
      {from:'a.pine@starhaven.lib',to:'████@████.sec',body:`There's a trainer worth your attention — Maxine Blaze. Aridune-born, came through the refugee corridor as a child, made herself into a Federation competitor on nothing but will. Strong, angry in the useful way, and entirely without illusions about who emptied her homeland.

She doesn't know the half of why the desert burned. When she learns it was a program and not a misfortune, I think she comes to us on her own feet.`},
      {from:'████@████.sec',to:'a.pine@starhaven.lib',body:`Approved to develop. But the approach is everything — you don't hand someone like that a pamphlet. You let her find the thread and pull it herself. Position the truth where she'll trip over it. The desert did our recruiting; we just open the door.

Keep her clear of the Veerulent specifics until she's committed. The field-test details are not a recruitment tool. They're a liability until she's one of us.
MB`},
     ]},
    {id:'a6', subj:'The door-work', date:'work archive · thread 6', unread:false, thread:'cache',
     msgs:[
      {from:'s.r.@████.sec',to:'a.pine@starhaven.lib',body:`Dr. Pine,

Progress on the corruption project is real but slow, and slow is the only safe speed. The influence does not "transfer" so much as it is invited — the subject has to be opened, and the opening does not close on its own afterward. We are learning the closing. It is harder than the opening by an order I did not expect.

The Twilight practitioners up north know things we don't, and won't share them. I'd give a great deal for one of their people on staff. Failing that, I'll keep paying for what washes down from the Depths.

One more thing, and I want it on a record only you and I read: the phenomenon is not ours alone. I've made contact with a group operating out of Orre — yes, that far, the other side of the world. They've been engineering corrupted Pokémon for years by their own method, a "closing of the heart's door." Cruder than what the Depths produce here, but they have volume, and a man named Ein who has written down more about the process than anyone on our side dares to. The distance is the whole appeal — what we trade with Orre never touches a Federation wire.
S.R.`},
      {from:'a.pine@starhaven.lib',to:'s.r.@████.sec',body:`Understood, and agreed on the pace. MB wants results; I keep telling MB that this is not a thing one hurries without making a monster nobody commands. The orb work and the door-work should not touch — keep your subjects far from anything resonant until we know what proximity does.

The Orre channel is sanctioned — quietly. Take what Ein's people have learned and improve on it; do not let them learn what we know in return. They think the corruption is a technique. We know better. Keep that asymmetry.

"E" will be passing through your area. Give him what he needs and keep him on a short tether. You know what he is.
A.`},
      {from:'s.r.@████.sec',to:'a.pine@starhaven.lib',body:`"E" is the last thing my project needs near it. But I know better than to refuse. I'll keep the corridor clear and the cameras off.
S.R.`},
     ]},
    {id:'a7', subj:'— (the Spear, and "E")', date:'work archive · thread 7', unread:false, thread:'cache',
     msgs:[
      {from:'████@████.sec',to:'a.pine@starhaven.lib; s.r.@████.sec',body:`"E" recovered the object. That was the mission and the mission is complete, so I will say the rest once: he nearly cost us four trainers doing it, and those four trainers are the surveyors we cannot replace. The carrier party walked away — barely — and "E" considered that a generosity on his part.

He is an instrument with a will of its own. Useful. Expensive. Watch him.
MB`},
      {from:'a.pine@starhaven.lib',to:'████@████.sec',body:`The object is what we thought it was, then. That makes two. I won't write the word for it even here.

And yes — "E" nearly broke the very people doing our digging for us. If he touches the carrier party again before they've opened the last rooms for us, the cost isn't his to spend. Make that clear to him in whatever language he respects.
A.`},
     ]},
    {id:'a8', subj:'burn it', date:'work archive · thread 8 · last', unread:false, thread:'cache',
     msgs:[
      {from:'a.pine@starhaven.lib',to:'████@████.sec; s.r.@████.sec',body:`Someone is in the system who is not one of ours. Not Federation security — I know their footprint, this isn't it. Whoever it is went straight for the Chimera forwards and the breach logs, the two things I am most exposed on.

At least one specimen is loose at the lower site and not on any manifest. That is not a coincidence with the intrusion. Something is happening that none of us authored.

I am going dark. Erase your side. Do not contact this address again — if you're reading mail to it after today, it isn't me reading the replies.
A.`},
      {from:'████@████.sec',to:'a.pine@starhaven.lib',body:`Acknowledged. Go.

You did the work. Disappear well.
MB`},
     ]},
  ],
};

function bootIn(){

       if(fs){ const p=fs.call(document.documentElement); if(p&&p.catch)p.catch(()=>{}); } }catch(e){}

function enterDesktop(){
  document.getElementById('login').style.display='none';

/* ============================================================
   WINDOW MANAGER
   ============================================================ */
function openApp(app, payload){
  // singletons for most apps; image/notes can stack but we reuse by content
  if(app!=='notes' && app!=='image'){
    const ex=Object.values(WINS).find(w=>w.app===app);
    if(ex){ focusWin(ex.id); if(payload) ex.refresh&&ex.refresh(payload); return ex.id; }
  }
  const id='w'+(++winSeq);
  const el=document.createElement('div'); el.className='win'; el.dataset.id=id;
  const W=appDefaultSize(app);
  const offset=(Object.keys(WINS).length%6)*26;
  el.style.width=W.w+'px'; el.style.height=W.h+'px';
  el.style.left=Math.min(120+offset, window.innerWidth-W.w-20)+'px';
  el.style.top=Math.max(20, 60+offset)+'px';
  el.style.zIndex=(++zTop);
  el.innerHTML=`
    <div class="titlebar">
      <span class="tb-glyph">${APPS[app].glyph}</span>
      <span class="tb-title" id="${id}-title">${APPS[app].title}</span>
      <div class="tb-btns">
        <button class="tb-btn tb-min" title="Minimize"></button>
        <button class="tb-btn tb-close" title="Close"></button>
      </div>
    </div>
    <div class="win-body" id="${id}-body"></div>
    <div class="resize-h"></div>`;
  document.getElementById('desktop').appendChild(el);
  const rec={id,app,el,payload};
  WINS[id]=rec;
  // wiring
  el.querySelector('.tb-min').onclick=(e)=>{e.stopPropagation();minimizeWin(id);};
  el.querySelector('.tb-close').onclick=(e)=>{e.stopPropagation();closeWin(id);};
  el.onmousedown=()=>focusWin(id);
  makeDraggable(el, el.querySelector('.titlebar'), id);
  makeResizable(el, el.querySelector('.resize-h'));
  // body
  renderApp(rec, payload);
  focusWin(id);
  syncTaskbar();
  return id;
}
function appDefaultSize(app){
  const map={files:{w:620,h:430},mail:{w:680,h:470},image:{w:560,h:480},notes:{w:560,h:480},
    music:{w:360,h:420},ether:{w:390,h:470},trash:{w:560,h:420},settings:{w:480,h:440},messages:{w:600,h:520},web:{w:740,h:520}};
  let s=map[app]||{w:520,h:400};
  return {w:Math.min(s.w, window.innerWidth-30), h:Math.min(s.h, window.innerHeight-70)};
}
function focusWin(id){
  const w=WINS[id]; if(!w) return;
  w.el.style.display='flex';
  w.minimized=false;
  if(focusedWin && WINS[focusedWin]) WINS[focusedWin].el.classList.remove('focused');
  w.el.classList.add('focused'); w.el.style.zIndex=(++zTop);
  focusedWin=id; syncTaskbar();
}
function minimizeWin(id){ const w=WINS[id]; if(!w)return; w.el.style.display='none'; w.minimized=true; if(focusedWin===id)focusedWin=null; w.el.classList.remove('focused'); syncTaskbar(); }
function closeWin(id){
  const w=WINS[id]; if(!w)return;
  if(w.app==='image' && openImageWin===id) openImageWin=null;
  if(w.onClose) w.onClose();
  w.el.remove(); delete WINS[id];
  if(focusedWin===id)focusedWin=null;
  syncTaskbar();
}
function makeDraggable(el, handle, id){
  let sx,sy,ox,oy,drag=false;
  handle.onmousedown=(e)=>{ if(e.target.classList.contains('tb-btn'))return; drag=true; focusWin(id);
    sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop; e.preventDefault(); };
  document.addEventListener('mousemove',(e)=>{ if(!drag)return;
    let nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    nx=Math.max(-el.offsetWidth+80, Math.min(window.innerWidth-60, nx));
    ny=Math.max(0, Math.min(window.innerHeight-80, ny));
    el.style.left=nx+'px'; el.style.top=ny+'px'; });
  document.addEventListener('mouseup',()=>drag=false);
  // touch
  handle.addEventListener('touchstart',(e)=>{ if(e.target.classList.contains('tb-btn'))return; drag=true; focusWin(id);
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; ox=el.offsetLeft; oy=el.offsetTop; },{passive:true});
  document.addEventListener('touchmove',(e)=>{ if(!drag)return; const t=e.touches[0];
    el.style.left=(ox+(t.clientX-sx))+'px'; el.style.top=Math.max(0,oy+(t.clientY-sy))+'px'; },{passive:true});
  document.addEventListener('touchend',()=>drag=false);
}
function makeResizable(el, handle){
  let sx,sy,ow,oh,rz=false;
  handle.onmousedown=(e)=>{ rz=true; sx=e.clientX; sy=e.clientY; ow=el.offsetWidth; oh=el.offsetHeight; e.preventDefault(); e.stopPropagation(); };
  document.addEventListener('mousemove',(e)=>{ if(!rz)return;
    el.style.width=Math.max(280, ow+(e.clientX-sx))+'px';
    el.style.height=Math.max(170, oh+(e.clientY-sy))+'px'; });
  document.addEventListener('mouseup',()=>rz=false);
}

/* ---------- FILES ---------- */
function renderFiles(rec, body){
  rec.cwd = rec.cwd || [];          // path array
  const draw=()=>{
    const {node,label,files,folders}=resolvePath(rec.cwd);
    // shared-exp ether tracking
    sharedExpOpen = (rec.cwd.join('/')==='Research/shared-exp');
    if(sharedExpOpen) triggerEtherSpike(); else maybeClearSpike();

    let side='';
    Object.keys(TREE).forEach(k=>{
      const active = rec.cwd[0]===k ? 'active':'';
      side+=`<div class="side-item ${active}" data-root="${k}"><span>${TREE[k].glyph}</span>${k}</div>`;
    });
    const crumb = ['~'].concat(rec.cwd).map((s,i)=> i===0?`<span>${s}</span>`:`<span class="seg">/ ${s}</span>`).join(' ');

    let items='';
    folders.forEach(f=>{ items+=`<div class="fitem folder" data-folder="${f}"><span class="fg">📁</span><span class="fn">${f}</span></div>`; });
    files.forEach(fid=>{
      const f=fileById(fid); if(!f) return;
      const unread = !STATE.read[fid] ? 'unread':'';
      const added = f.ghost ? 'justadded':'';
      items+=`<div class="fitem ${unread} ${added}" data-file="${fid}"><span class="fg">${f.glyph}</span><span class="fn">${escapeHtml(f.name)}</span></div>`;
    });
    if(!folders.length && !files.length) items=`<div class="files-empty">empty folder</div>`;

    body.innerHTML=`<div class="files">
      <div class="files-side">${side}</div>
      <div class="files-main">
        <div class="files-crumb">${crumb}</div>
        <div class="files-list">${items}</div>
      </div></div>`;

    body.querySelectorAll('.side-item').forEach(e=> e.onclick=()=>{ rec.cwd=[e.dataset.root]; draw(); });
    body.querySelectorAll('[data-folder]').forEach(e=> e.ondblclick=()=>{ rec.cwd=rec.cwd.concat(e.dataset.folder); draw(); });
    body.querySelectorAll('[data-folder]').forEach(e=> e.onclick=()=>highlight(e));
    body.querySelectorAll('[data-file]').forEach(e=> e.ondblclick=()=>openFile(e.dataset.file));
    body.querySelectorAll('[data-file]').forEach(e=> e.onclick=()=>highlight(e));
    setWinTitle(rec.id, 'Files — '+(rec.cwd.length?('~/'+rec.cwd.join('/')) : '~'));
  };
  rec.refresh=draw;
  rec.onClose=()=>{ if(sharedExpOpen){ sharedExpOpen=false; maybeClearSpike(); } };
  draw();
}
function highlight(e){ e.parentElement.querySelectorAll('.fitem').forEach(x=>x.style.background=''); e.style.background='rgba(255,165,0,.12)'; }
function resolvePath(path){
  if(!path.length) return {files:[],folders:Object.keys(TREE),label:'~'};
  let node=TREE[path[0]]; let folders=[]; let files=node?node.files.slice():[];
  if(node&&node.sub) folders=Object.keys(node.sub);
  for(let i=1;i<path.length;i++){ node=node.sub[path[i]]; files=node?node.files.slice():[]; folders=node&&node.sub?Object.keys(node.sub):[]; }
  // inject co-user ghost file into Aurora if mutation fired
  if(path.join('/')==='Aurora' && STATE.mutations.includes('couser-note')) files=files.concat('couser-note');
  return {node,files,folders,label:path.join('/')};
}
function fileById(id){ if(id==='couser-note')return COUSER_FILE; return FILES[id]?Object.assign({id},FILES[id]):null; }

function openFile(id){
  const f=fileById(id); if(!f) return;
  if(!f.trash){ markRead(id); }
  if(f.app==='image'){ openImageAt(f.img, f.name); }
  else if(f.app==='enc'){ openEnc(f); }
  else { openApp('notes', id); }
}
function markRead(id){ if(!STATE.read[id]){ STATE.read[id]=true; persist(); checkThreads(); bumpSuspicion(6); } }

  rec.fileId=id; rec.titleText=f.name;

  } else {
    html=`<div class="reader plain"><div class="meta-strip">${escapeHtml(f.name)}</div><div class="docnote">${redactHtml(f.body)}</div></div>`;

}

/* ---------- IMAGE VIEWER ---------- */
const IMAGE_ORDER=['sisters','memories','reeds','auroranow','library','tower','coast','gate','lintel','gulls','tea'];
function openImageAt(imgKey, fname){
  let id=openImageWin;
  if(id && WINS[id]){ focusWin(id); WINS[id].imgKey=imgKey; renderImage(WINS[id], document.getElementById(id+'-body')); }
  else{ id=openApp('image'); WINS[id].imgKey=imgKey; renderImage(WINS[id], document.getElementById(id+'-body')); openImageWin=id; }
}
function renderImage(rec, body, payload){
  if(!rec.imgKey) rec.imgKey='sisters';
  openImageWin=rec.id;
  const draw=()=>{
    const key=rec.imgKey; const im=IMAGES[key];
    const idx=IMAGE_ORDER.indexOf(key);
    const art=(k)=>{ const t=IMAGES[k]; return t.photo?`<img src="${t.photo}" alt="" loading="lazy">`:t.svg; };
    let thumbs=IMAGE_ORDER.map(k=>`<div class="iv-thumb ${k===key?'active':''}" data-k="${k}">${art(k)}</div>`).join('');
    body.innerHTML=`<div class="iv">
      <div class="iv-bar">
        <button class="iv-nav" data-d="-1">‹</button>
        <span class="iv-count">${idx+1} / ${IMAGE_ORDER.length}</span>
        <button class="iv-nav" data-d="1">›</button>
      </div>
      <div class="iv-stage">${art(key)}</div>
      <div class="iv-cap">${im.cap?escapeHtml(im.cap):'&nbsp;'}</div>
      <div class="iv-thumbs">${thumbs}</div>
    </div>`;
    // photo file missing -> fall back to the vector mock
    body.querySelectorAll('.iv-stage img, .iv-thumb img').forEach(img=>{
      img.onerror=()=>{ const host=img.closest('.iv-thumb'); const k=host?host.dataset.k:key; img.outerHTML=IMAGES[k].svg; };
    });
    body.querySelectorAll('.iv-nav').forEach(b=> b.onclick=()=>{ let n=(idx+parseInt(b.dataset.d)+IMAGE_ORDER.length)%IMAGE_ORDER.length; rec.imgKey=IMAGE_ORDER[n]; markImageRead(IMAGE_ORDER[n]); draw(); });
    body.querySelectorAll('.iv-thumb').forEach(t=> t.onclick=()=>{ rec.imgKey=t.dataset.k; markImageRead(t.dataset.k); draw(); });
    setWinTitle(rec.id, 'Image Viewer — '+imgFilename(key));
  };
  rec.refresh=draw; rec.onClose=()=>{ if(openImageWin===rec.id) openImageWin=null; };
  markImageRead(rec.imgKey);
  draw();
}
function imgFilename(key){ const id=Object.keys(FILES).find(k=>FILES[k].img===key && !FILES[k].trash); return id?FILES[id].name:'image'; }
function markImageRead(key){ const id=Object.keys(FILES).find(k=>FILES[k].img===key && !FILES[k].trash); if(id) markRead(id); }

/* ---------- MAIL ---------- */
const MAIL_FOLDERS=[['inbox','Inbox'],['drafts','Drafts'],['sent','Sent'],['archive','Archive (work)']];
function renderMail(rec, body){
  rec.folder=rec.folder||'inbox'; rec.sel=rec.sel||null;
  const draw=()=>{
    const list = rec.folder==='inbox' ? MAIL.inbox.filter(m=>!m.ghost || m._arrived) : (MAIL[rec.folder]||[]);
    const unreadCt = MAIL.inbox.filter(m=>(!m.ghost||m._arrived)&&m.unread).length;
    let rows = list.map(m=>{
      const active=rec.sel===m.id?'active':'';
      const unread=m.unread?'unread':'';
      const fromLine = rec.folder==='archive' ? 'work · cache'
                     : rec.folder==='inbox'   ? (m.from||'')
                     : 'to: '+(m.to||'');
      return `<div class="mrow ${active} ${unread}" data-id="${m.id}">
        <div class="mfrom">${escapeHtml(fromLine)}</div>
        <div class="msubj">${escapeHtml(m.subj)}</div>
        <div class="mdate">${escapeHtml(m.date||'')}</div></div>`;
    }).join('');
    if(!list.length) rows=`<div class="mail-empty">empty</div>`;

    let read=`<div class="mail-empty">select a message</div>`;
    if(rec.sel){
      const m=list.find(x=>x.id===rec.sel);
      if(m) read=renderMailBody(m, rec.folder);
    }
    const folders=MAIL_FOLDERS.map(([f,label])=>{
      const ct = f==='inbox' ? (unreadCt||'') : '';
      return `<div class="mail-folder ${rec.folder===f?'active':''}" data-f="${f}">${label} <span class="ct">${ct}</span></div>`;
    }).join('');
    body.innerHTML=`<div class="mail">
      <div class="mail-side">${folders}</div>
      <div class="mail-list">${rows}</div>
      <div class="mail-read">${read}</div>
    </div>`;
    body.querySelectorAll('.mail-folder[data-f]').forEach(e=> e.onclick=()=>{ rec.folder=e.dataset.f; rec.sel=null; draw(); });
    body.querySelectorAll('.mrow').forEach(e=> e.onclick=()=>{ rec.sel=e.dataset.id; const m=list.find(x=>x.id===rec.sel); if(m&&m.unread){m.unread=false; bumpSuspicion(5);} draw(); });
    setWinTitle(rec.id,'Mail — '+(MAIL_FOLDERS.find(x=>x[0]===rec.folder)||['','Mail'])[1]);
  };
  rec.refresh=draw; draw();
}
function renderMailBody(m, folder){
  if(m.msgs){ // threaded cache email
    const body=m.msgs.map(x=>`<div class="thread-msg">
      <div class="th"><b>From:</b> ${escapeHtml(x.from)}<br><b>To:</b> ${escapeHtml(x.to)}</div>
      <div class="body mono">${redactHtml(x.body)}</div></div>`).join('');
    return `<div class="mh"><div class="s">${escapeHtml(m.subj)}</div><div class="kv">${m.msgs.length} messages · archived work correspondence</div></div>${body}`;
  }
  const cls = m.mono?'body mono':'body';
  let bodyTxt = m.body;
  let extra = '';
  if(m.id==='d-tech' && STATE.mutations.includes('draft-edited')){
    extra = `<div class="body mono" style="margin-top:26px;border-top:1px solid var(--line);padding-top:14px;color:var(--orange)">— line appended to this draft just now, from the other session: —

leave him alone. he has paid enough.</div>`;
  }
  const banner = folder==='drafts' ? `<div class="kv" style="color:var(--orange-dim)">DRAFT — never sent</div>` : '';
  return `<div class="mh"><div class="s">${escapeHtml(m.subj)}</div>
    ${banner}
    <div class="kv"><b>From</b> ${escapeHtml(m.from)}</div>
    <div class="kv"><b>To</b> ${escapeHtml(m.to)}</div>
    <div class="kv"><b>Date</b> ${escapeHtml(m.date)}</div></div>
    <div class="${cls}">${redactHtml(bodyTxt)}</div>${extra}`;
}

function renderWeb(rec, body){
  rec.url=rec.url||'lumen://start'; rec.stack=rec.stack||[]; rec.menu=false;
  const draw=()=>{
    const page = SITES[rec.url] ? SITES[rec.url]()
      : `<div class="ws ws-err"><div class="box"><div class="ico">🔌</div><h1>Page not found</h1><p>Nothing answers at this address. The address book is small out here.</p><div class="addr">${escapeHtml(rec.url)}</div></div></div>`;
    const menu = rec.menu ? `<div class="web-menu">${['lumen://start'].concat(WEB_BOOKMARKS.map(b=>b[0])).map(u=>`<div data-go="${u}">${u}</div>`).join('')}</div>` : '';
    body.innerHTML=`<div class="web">
      <div class="web-bar">
        <button class="web-btn" data-act="back" title="Back">‹</button>
        <button class="web-btn" data-act="home" title="Start page">⌂</button>
        <div class="web-addr" title="saved addresses">${escapeHtml(rec.url)}</div>
        ${menu}
      </div>
      <div class="web-page">${page}</div>
    </div>`;
    body.querySelector('[data-act="back"]').onclick=()=>{ if(rec.stack.length){ rec.url=rec.stack.pop(); rec.menu=false; draw(); } };
    body.querySelector('[data-act="home"]').onclick=()=>webGo(rec,'lumen://start');
    body.querySelector('.web-addr').onclick=()=>{ rec.menu=!rec.menu; draw(); };
    body.querySelectorAll('[data-go]').forEach(e=> e.onclick=()=>webGo(rec, e.dataset.go));
    const portal=body.querySelector('[data-portal]');
    if(portal) portal.onclick=()=>{
      const box=body.querySelector('#reedside-portal');
      if(box) box.innerHTML='portal unavailable — please contact the duty desk.<br><span style="color:var(--faint)">(your sign-in attempt was logged)</span>';
      bumpSuspicion(6);
    };
    setWinTitle(rec.id, 'Browse — '+rec.url);
  };
  rec.refresh=draw; draw();
}
function webGo(rec, url){
  if(url===rec.url){ rec.menu=false; rec.refresh(); return; }
  rec.stack.push(rec.url); rec.url=url; rec.menu=false;
  if(url!=='lumen://start'){
    STATE.webHistory=(STATE.webHistory||[]);
    STATE.webHistory.push({url, t:clockStr()});
    if(!STATE.read['web:'+url]){ STATE.read['web:'+url]=true; bumpSuspicion(4); }
    persist();
  }

  };
  tick();
  let ai=Math.floor(etherT)%ETHER_AMBIENT.length;

function etherWave(t, mode){ // 0 calm baseline · 1 active coupling (orange) · 2 carrier signature (slow standing pulse)

    if(mode===2) y = 38 + Math.sin(x/21 - t*1.2)*3 - (((x + t*46) % 97) < 7 ? 10 : 0);
    p += x+','+y.toFixed(1)+' ';
  }
  return p;
}

n16:{them:['We don’t test each other. That is also our entire arrangement.'], fx:{sus:8}},
n17:{them:['Hm.','Whoever you are tonight, you are not making me less worried.'], fx:{sus:14}},

n6:{them:['You haven’t needed reminding since the day you arrived here. What happened?'],
 opts:[{t:'I played her the song on my last visit. She smiled at me like a polite stranger.',to:'n18'},
       {t:'Nothing happened. I’m tired.',to:'n7'}]},

n18:{them:['…I’m coming up. The kettle is still warm.'],
 opts:[{t:'Don’t. I’m fine.',to:'n19'},
       {t:'All right.',to:'n20'}]},

n19:{them:['You are never fine at two in the morning in her folders.','I’ll leave the tea outside the door.'], fx:{knock:true}},
n20:{them:['Five minutes.'], fx:{knock:true, drop:true}},

n4:{them:['I read everything. It is why you are still safe in this house, and why the others tolerate the arrangement.'],
 opts:[{t:'Safe. Is that what I am.',to:'n21'},
       {t:'Whose arrangement — yours, or theirs?',to:'n22'}]},

n21:{them:['Safer than you would be anywhere else. We both know there is a list of people looking.'],
 opts:[{t:'Who is looking?',to:'n23'},
       {t:'Good night.',to:'n24'}]},

n23:{them:['Federation auditors. Two of them, polite letters so far.','And something else that does not write letters. Keep your head down and your light off the water.'], fx:{sus:6}},
n24:{them:['Good night, Amelia. Log off first this time.']},

n22:{them:['Names and ownership don’t go on this channel.','You taught me that, the first week. You made me write it down.'], fx:{sus:6}},

n7:{them:['Fine. Keep your locked doors.','But hear me: this household notices patterns. Don’t become one.']},

/* --- cover-crack branch --- */
nx:{them:['…That’s not funny.','Amelia. Tell me that’s you.'], fx:{sus:10},
 opts:[{t:'Of course it’s me. Bad joke. Long night.',to:'nx2'},
       {t:'This isn’t Amelia.',to:'nb1'},
       {t:'(say nothing)',to:'nb2'}]},

nx2:{them:['Your jokes are usually worse than that.','…Type the thing you say when I worry.'],
 opts:[{t:'“Slowly, and safely.”',to:'nx3'},
       {t:'“Everything is fine.”',to:'nfail'},
       {t:'“Good night.”',to:'nfail'}]},

nx3:{them:['…All right. Slowly and safely.','Get some sleep. And get off this machine.'], fx:{sus:-12}},

nfail:{them:['That is not it.','Get off this machine. Whoever you are — the house has already seen you.'], fx:{cover:true, drop:true, sus:20}},

nb1:{them:['Then you should know that this channel is logged.','And that the room you are sitting in is not as far away as you think.'], fx:{cover:true, drop:true, sus:20}},
nb2:{them:['who is this'], fx:{cover:true, drop:true, sus:20}},

/* --- silence branch --- */
silent:{them:['I can see the account active. Reading her folders at this hour and not answering me — that is either you at your worst, or it is not you at all.'],
 opts:[{t:'It’s me. At my worst.',to:'n25'},
       {t:'(keep silent)',to:'nb2'},
       {t:'Not answering was kinder than what I’d say.',to:'n4'}]},

n25:{them:['…Honesty. Then I will worry less, and differently.'],
 opts:[{t:'Worry about the work instead.',to:'n5'},
       {t:'Don’t worry at all. Good night.',to:'n26'}]},
n26:{them:['One of us has to.']},
};

/* ============================================================
   MESSAGES APP — two conversations:
   · VESPER  — an ongoing Scepter relay chat the player WATCHES unfold
               (read-only; backlog + a live drip that ends in the relay
               noticing Amelia isn't really the one reading). Feral Rot in
               Florinex, the League's coming mistake, and Marcus wanting to
               deploy P-1 — which Amelia refuses, her real motive leaking.
   · ████    — the house channel (Helena): the live-intrusion branching tree
               where the player must answer as Amelia. Dormant until the
               co-user event (openIM) brings it live.
   ============================================================ */
const CHATS=[
  {id:'vesper', name:'VESPER',   sub:'secure relay · Shadows'},
  {id:'maxine', name:'M. BLAZE', sub:'secure relay · field'},
  {id:'house',  name:'████',     sub:'house channel'},
];

/* VESPER — already-exchanged backlog (read on open). who: them=VESPER, me=Amelia */
const VESPER_BACKLOG=[
 {who:'them', text:'You saw the Florinex corridor numbers?'},
 {who:'me',   text:'I wrote half of them. Site Alpha still copies me on the corridor reports — nobody ever took my name off the distribution list.'},
 {who:'them', text:'Then you know it’s past the river. Sick Elking, the water going wrong, a Venomire that couldn’t hold its own venom. The rangers are calling it a blight. They don’t have a name for it.'},
 {who:'me',   text:'It has a name and it’s ours. Two containers off a transport that should never have been touched. Veerum breeding true in the wild, the compound through the soil and into the food chain.'},
 {who:'them', text:'We do not put that op in writing.'},
 {who:'me',   text:'I’m not writing it. I’m telling you it isn’t a leak anymore. It’s an ecology. You don’t clean those up — you outlive them, or you don’t.'},
 {who:'them', text:'Does the program leadership understand that?'},
 {who:'me',   text:'The program leadership is delighted. Vistrix’s people read the same field reports I do and they don’t see a disaster — they see a trial that ran itself for free. “Environmental viability, confirmed.” They’ve a researcher sitting in a route station writing the corpse count up like a quarterly.'},
 {who:'them', text:'That’s the part that frightens me. They think they won.'},
 {who:'me',   text:'They think they won. So they’ll do it again on purpose, somewhere it counts — the desert theatre, where the shipment was headed. Loud. Because no one has told them the corridor is about to bury Pokémon faster than the rangers can log them.'},
 {who:'them', text:'And then the League makes its mistake.'},
 {who:'me',   text:'And then the League makes its mistake. It cordons the wrong valley, or it culls it, or it stands up at the Pax Cove championship and calls it a natural outbreak — and every trainer who watched a starter rot from the inside knows the League just lied to their face. That is not a problem for us. That is a recruiting season.'},
 {who:'them', text:'Marcus wants it documented before it breaks. Hard evidence, in our hands, the hour the League denies it. He thinks it’s worth an asset.'},
 {who:'me',   text:'Which asset.'},
 {who:'them', text:'You know which one. The championship puts every official who matters under one roof. The Proteus walks in wearing a face nobody questions, lifts the corridor file, walks out. Only it can do that.'},
 {who:'me',   text:'No.'},
 {who:'them', text:'It isn’t a no you get to make by yourself, A. Marcus asked. I’m only the relay.'},
 {who:'me',   text:'Then relay this. The asset has gone out four times this year. It wore the quartermaster at Alder to move a convoy schedule. It walked a meeting in Grandharbor in a shape I will not put on this channel. Every deployment is a thing that can go wrong in a way I cannot undo. It is not a lockpick, and it does not grow back.'},
 {who:'them', text:'It came home fine every time.'},
 {who:'me',   text:'It came home. And it asked me, after, whether it had done well. It holds the borrowed faces a little longer each time before it lets them go. You don’t see that part. I do.'},
 {who:'them', text:'Amelia. It is a tool with an excellent success rate. Don’t turn it into a person.'},
 {who:'me',   text:'I know exactly what it is. Tell Marcus the asset stays in this house. Find him another door.'},
];
/* VESPER — live drip while the player watches; ends in the relay noticing the reader isn't Amelia */
const VESPER_LIVE=[
 {who:'them', text:'Marcus is going to push on the asset. You should have an answer ready that isn’t just “no.”'},
 {who:'them', text:'You there? The relay says you’re reading.'},
 {who:'them', text:'You never go quiet about Florinex. You have opinions about the water table.'},
 {who:'them', text:'Two ticks against every line. You’ve read all of this and typed nothing.'},
 {who:'them', text:'The last time you read me and went silent, it was bad news you were deciding how to soften.'},
 {who:'them', text:'…This isn’t how you type. The cadence is wrong.'},
 {who:'them', text:'Who is this.'},
 {who:'sys',  text:'VESPER has stopped. The relay shows the channel still open — and still being read.'},
];

/* MAXINE BLAZE — a read-only, dormant backlog. Amelia (me) recruited her out of the
   Aridune refugee corridor; she is in Estwal prepping an operation. Somber friendliness;
   Amelia quietly tracks Maxine's old League team (Victor Crimson, Ava Frost — Montevera)
   for her. The thread ends on Amelia's worried, unanswered check-in. who: them=Maxine, me=Amelia */
const MAXINE_BACKLOG=[
 {who:'me',   text:'You made Estwal. Tell me you slept on the crossing and didn’t read that file the whole way.'},
 {who:'them', text:'Slept once. The file’s thin. The kind of thin that means someone left things out.'},
 {who:'me',   text:'Then trust what’s missing as much as what’s there. You read silence better than the people who wrote it.'},
 {who:'them', text:'You always say that.'},
 {who:'me',   text:'Because it keeps being true.'},
 {who:'them', text:'How are they.'},
 {who:'me',   text:'Victor and Ava are in Montevera, both well. He’s working the southern circuit — lost the rock badge, went back the next week and took it, loudly. Ava reached the quarterfinals at the Montevera invitational.'},
 {who:'them', text:'Quarters. She’d have had the semis if Victor didn’t spend their prep arguing type coverage. He always did that.'},
 {who:'me',   text:'By every account, he still does.'},
 {who:'them', text:'Did they ask after me.'},
 {who:'me',   text:'The story that’s out is that you’re training overseas, and it’s holding. No one is looking for you. That’s the mercy and the cost both.'},
 {who:'them', text:'I can usually tell which one it is. Not always.'},
 {who:'them', text:'You don’t have to run the Montevera reports. It’s not your job, and it’s a thread someone could pull every time you do.'},
 {who:'me',   text:'It’s a small thread, and I decide what my job is. You left people to come to us. The least we can do is let you watch them from somewhere safe.'},
 {who:'me',   text:'When the day comes that you’d rather not know, tell me, and I’ll stop.'},
 {who:'them', text:'Don’t stop.'},
 {who:'them', text:'When Estwal’s done — and the ones after it — someone answers for the corridor. That’s the only clock I keep.'},
 {who:'me',   text:'I know. I watch that clock too. Don’t let it run you tonight.'},
 {who:'me',   text:'How are you. Not the operation — you.'},
 {who:'them', text:'Aridune-shaped. I walk into a town and count the water and the exits before I count anything else. Estwal has good water and bad exits.'},
 {who:'me',   text:'Then mark the exits, and we talk before you move. Rest first — the file will still be thin in the morning.'},
 {who:'them', text:'Goodnight, Doctor.'},
 {who:'me',   text:'Goodnight, Maxine.'},
 {who:'me',   text:'Four days now. The relay says you’ve read this far, so read this part too: whatever Estwal asks of you, you come back from it. That isn’t an order. I don’t have one that outranks it.'},
];

function msgBubble(m){ return `<div class="im-msg ${m.who}">${escapeHtml(m.text)}</div>`; }
function msgScroll(id){ const l=document.getElementById(id); if(l) l.scrollTop=l.scrollHeight; }

function renderMessages(rec, body){
  rec.active = rec.active || STATE.msgActive || 'vesper';
  const clearDrip=()=>{ if(rec.vTimer){ clearTimeout(rec.vTimer); rec.vTimer=null; } if(rec.vType){ clearTimeout(rec.vType); rec.vType=null; } };
  rec.onClose=()=>{ clearDrip(); };

  /* ---- contact list metadata ---- */
  const meta=(id)=>{
    if(id==='vesper'){
      const delivered=VESPER_BACKLOG.concat(VESPER_LIVE.slice(0,STATE.vesperStep));
      const last=delivered[delivered.length-1];
      const more=STATE.vesperStep<VESPER_LIVE.length;
      return {online:more, unread:!STATE.vesperRead, prev:last?last.text:''};
    }
    if(id==='maxine'){
      const last=MAXINE_BACKLOG[MAXINE_BACKLOG.length-1];
      return {online:false, unread:false, prev:last?last.text:''};
    }
    const last=STATE.imLog[STATE.imLog.length-1];
    return {online:STATE.imStarted&&!STATE.imEnded,
            unread:STATE.imStarted&&!STATE.imEnded&&rec.active!=='house',
            prev:STATE.imStarted?(last?last.text:'…'):'no recent messages'};
  };

  const draw=()=>{
    const side=CHATS.map(c=>{
      const m=meta(c.id);
      return `<div class="msg-contact ${rec.active===c.id?'active':''} ${m.unread?'unread':''}" data-c="${c.id}">
        <div class="nm">${escapeHtml(c.name)}<span class="dot ${m.online?'':'off'}"></span></div>
        <div class="sub">${escapeHtml(c.sub)}</div>
        <div class="prev">${escapeHtml(m.prev||'')}</div></div>`;
    }).join('');
    body.innerHTML=`<div class="msgs"><div class="msgs-side">${side}</div><div class="msgs-conv" id="${rec.id}-conv"></div></div>`;
    body.querySelectorAll('.msg-contact').forEach(e=> e.onclick=()=>{ clearDrip(); rec.active=e.dataset.c; STATE.msgActive=rec.active; persist(); renderIcons(); draw(); });
    drawConv();
    setWinTitle(rec.id,'Messages — '+(CHATS.find(c=>c.id===rec.active)||{name:''}).name);
  };
  const drawConv=()=>{
    const conv=document.getElementById(rec.id+'-conv'); if(!conv) return;
    if(rec.active==='vesper') drawVesper(conv);
    else if(rec.active==='maxine') drawMaxine(conv);
    else drawHouse(conv);
  };

  /* ---- VESPER (watch + drip) ---- */
  const drawVesper=(conv)=>{
    if(!STATE.vesperRead){ STATE.vesperRead=true; persist(); renderIcons(); }
    const delivered=VESPER_BACKLOG.concat(VESPER_LIVE.slice(0,STATE.vesperStep));
    const more=STATE.vesperStep<VESPER_LIVE.length;
    const log=delivered.map(msgBubble).join('')+(rec.vBusy?`<div class="im-msg them typing">…</div>`:'');
    conv.innerHTML=`<div class="im">
      <div class="im-head">secure relay · <span class="who">VESPER</span> · Shadows liaison${more?' · online':''}</div>
      <div class="im-log" id="${rec.id}-vlog">${log}</div>
      <div class="im-end">${more?'— you are reading. you are not replying. —':'— end of channel —'}</div></div>`;
    msgScroll(rec.id+'-vlog');
    if(more && !rec.vTimer && !rec.vBusy && rec.active==='vesper'){
      rec.vTimer=setTimeout(()=>{
        rec.vTimer=null; rec.vBusy=true; drawConv();
        rec.vType=setTimeout(()=>{
          rec.vType=null; rec.vBusy=false;
          const line=VESPER_LIVE[STATE.vesperStep]; STATE.vesperStep++; persist();
          if(line && /who is this/i.test(line.text)) bumpSuspicion(8);
          drawConv();
        }, 1300);
      }, STATE.vesperStep===0?6500:5000);
    }
  };

  /* ---- Maxine Blaze (read-only backlog; dormant — no drip) ---- */
  const drawMaxine=(conv)=>{
    const log=MAXINE_BACKLOG.map(msgBubble).join('');
    conv.innerHTML=`<div class="im">
      <div class="im-head">secure relay · <span class="who">M. BLAZE</span> · Aridune-born · Estwal</div>
      <div class="im-log" id="${rec.id}-xlog">${log}</div>
      <div class="im-end">— quiet for days now · she is preparing —</div></div>`;
    msgScroll(rec.id+'-xlog');
  };

  /* ---- House channel (Helena) branching tree ---- */
  const houseSay=(who,text)=>{ STATE.imLog.push({who,text}); persist(); };
  const housePlay=(lines,done)=>{
    let i=0;
    const step=()=>{
      if(i>=lines.length){ rec.treeBusy=false; if(done)done(); drawConv(); return; }
      rec.treeBusy=true; drawConv();
      const line=lines[i++];
      setTimeout(()=>{ houseSay('them',line); step(); }, 800+Math.min(1900,line.length*22));
    };
    step();
  };
  const houseFx=(fx)=>{
    if(!fx) return;
    if(fx.sus) bumpSuspicion(fx.sus);
    if(fx.cover){ STATE.coverIntact=false; persist(); }
    if(fx.drop) setTimeout(()=>{ suspicion=20; refreshTrayUsers(); toast('Session','The second session ended. 1 user signed in.',false); }, 2400);
    if(fx.knock) setTimeout(()=> toast('…','From somewhere below, very faint: footsteps on the tower stairs.',false), 8000);
  };
  const houseEnter=(id)=>{
    STATE.imNode=id; persist();
    const node=IM_TREE[id];
    housePlay(node.them.slice(), ()=>{ houseFx(node.fx); if(!node.opts){ STATE.imEnded=true; persist(); renderIcons(); } });
  };
  const houseChoose=(i)=>{
    const node=IM_TREE[STATE.imNode]; if(!node||!node.opts||rec.treeBusy) return;
    const o=node.opts[i];
    houseSay(o.t.startsWith('(')?'sys':'me', o.t);
    drawConv();
    setTimeout(()=>houseEnter(o.to), 600);
  };
  const drawHouse=(conv)=>{
    if(!STATE.imStarted){
      conv.innerHTML=`<div class="im"><div class="im-head">encrypted house channel · <span class="who">████</span></div>
        <div class="msgs-empty">████ is offline.<br>no recent messages.</div></div>`;
      return;
    }
    const node=IM_TREE[STATE.imNode||'start']||{};
    const log=STATE.imLog.map(msgBubble).join('')+((rec.treeBusy&&rec.active==='house')?`<div class="im-msg them typing">…</div>`:'');
    let foot='';
    if(!GM_CONFIG.imInteractive) foot=`<div class="im-end">— the messages do not stop, and you cannot answer. —</div>`;
    else if(STATE.imEnded) foot=`<div class="im-end">— the other session closed the channel —</div>`;
    else if(!rec.treeBusy && node.opts) foot=`<div class="im-canned">${node.opts.map((o,i)=>`<button data-i="${i}">${escapeHtml(o.t)}</button>`).join('')}</div>`;
    conv.innerHTML=`<div class="im"><div class="im-head">encrypted house channel · <span class="who">████</span> · assumes you are Amelia — replies send as her</div>
      <div class="im-log" id="${rec.id}-hlog">${log}</div>${foot}</div>`;
    msgScroll(rec.id+'-hlog');
    conv.querySelectorAll('.im-canned button').forEach(b=> b.onclick=()=>houseChoose(parseInt(b.dataset.i)));
    if(!rec.treeBooted){
      rec.treeBooted=true;
      const cur=IM_TREE[STATE.imNode||'start'];
      const played=STATE.imLog.some(m=>m.who==='them' && cur && cur.them.includes(m.text));
      if(!STATE.imLog.length){ houseEnter('start'); }
      else if(!STATE.imEnded && cur && !played){ houseEnter(STATE.imNode); }
    }
  };

  rec.refresh=draw;
  draw();
}

/* ---- Tier-3 capstone: "who is this" types into a notes window, then 1 user ---- */
function capstoneEvent(){
  let w=Object.values(WINS).find(x=>x.app==='notes');
  const finish=()=>{ suspicion=20; refreshTrayUsers(); toast('Session', 'The second session ended. 1 user signed in.', false); };
  if(!w){ // open one to host the beat
    const id=openApp('notes', 'she-asked-again'); w=WINS[id];
  }
  const body=document.getElementById(w.id+'-body');
  const reader=body.querySelector('.reader');
  if(reader){
    const cap=document.createElement('div');
    cap.style.cssText='margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-family:var(--mono);color:var(--orange);font-size:15px';
    reader.appendChild(cap);
    const target='who is this';
    let i=0;
    const tick=()=>{ if(i<=target.length){ cap.textContent=target.slice(0,i)+'▋'; i++; setTimeout(tick, 180); } else { cap.textContent=target; setTimeout(finish, 1400); } };
    setTimeout(tick, 600);
  } else finish();
}

/* ---- ghost cursor flicker (ambient) ---- */
function ghostCursorBlip(){
  const g=document.getElementById('ghostCursor');
  const x=120+Math.floor(Math.abs(Math.sin(perfNow()))*(window.innerWidth-260));
  const y=120+Math.floor(Math.abs(Math.cos(perfNow()))*(window.innerHeight-260));
  g.style.left=x+'px'; g.style.top=y+'px'; g.style.opacity=1;
  setTimeout(()=>g.style.opacity=0, 900);
}

/* ============================================================
   THREAD ASSEMBLY (GM-facing console confirmation)
   ============================================================ */
function checkThreads(){
  const r=STATE.read;
  const A = ['coast-survey','gate','lintel','tower-study','manor-library'].filter(x=>r[x]).length>=2;
  const B = r['she-asked-again'] && (r['timeline']||r['records-wall']||r['two-of-us']||r['memories']||r['aurora-now']);
  const C = r['share-principle'] && r['door-both-ways'];
  if(A && !STATE._a){ STATE._a=true; console.log('%c[THREAD A — LOCATION] assembled: the players can place Amelia at Blackthorn Manor.','color:#ffa500'); }
  if(B && !STATE._b){ STATE._b=true; console.log('%c[THREAD B — AURORA] assembled: the amnesiac sister landed.','color:#ffa500'); }
  if(C && !STATE._c){ STATE._c=true; console.log('%c[THREAD C — EXP. SHARE] assembled: side-quest leads are live.','color:#ffa500'); }
}

/* ============================================================
   TOASTS
   ============================================================ */
function toast(tag, msg, ether){
  const box=document.getElementById('toasts');
  const t=document.createElement('div'); t.className='toast'+(ether?' ether':'');
  t.innerHTML=`<div class="tt">${escapeHtml(tag)}</div>${escapeHtml(msg)}`;
  t.onclick=()=>t.remove();
  box.appendChild(t);
  ghostCursorBlip();
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity=0; setTimeout(()=>t.remove(),400); }, 6500);
}

/* ============================================================
   LOGOUT / SHUTDOWN
   ============================================================ */
function logout(){
  persist();
  const sd=document.getElementById('shutdown'); sd.style.display='flex';
  document.getElementById('shutdownMsg').textContent='Signing out, A. Pine…';
  document.getElementById('shutdownSub').textContent = (STATE.mutations.length||Object.keys(STATE.fired).length)
    ? 'Some changes were made by another user. Sync on next login.' : '';
  if(coUserTimer)clearInterval(coUserTimer); if(clockTimer)clearInterval(clockTimer);
  setTimeout(()=>{ location.reload(); }, 2600);
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function redactHtml(s){ return escapeHtml(s).replace(/█+/g, m=>`<span class="redact">${m}</span>`); }
function perfNow(){ try{ return performance.now(); }catch(e){ return 0; } }

/* keyboard: Esc closes focused window */
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&focusedWin) closeWin(focusedWin); });
